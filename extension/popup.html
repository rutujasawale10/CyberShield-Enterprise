<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CyberShield Security</title>
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; background: #070a13; color: #f8fafc; margin: 0; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .title { font-weight: 800; color: #00f2fe; font-size: 1.1rem; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; text-align: center; }
    .btn { background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #070a13; font-weight: 800; padding: 10px 16px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .status-safe { color: #00e676; font-weight: 800; font-size: 1.2rem; }
    .status-phishing { color: #ff0844; font-weight: 800; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">CYBERSHIELD SOC</div>
    <span style="font-size: 0.75rem; color: #64748b;">v3.0</span>
  </div>

  <div class="card">
    <p id="targetUrl" style="font-size: 0.8rem; color: #94a3b8; word-break: break-all;">Scanning active tab...</p>
    <div id="resultBox" style="margin-top: 10px;">
      <p id="statusText" class="status-safe">SCANNING...</p>
      <p id="riskScore" style="font-size: 0.9rem; margin-top: 4px; color: #cbd5e1;"></p>
    </div>
    <button id="scanBtn" class="btn">ANALYZE ACTIVE TAB</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
