<!DOCTYPE html>
<html lang="en">
<head>

  <title>CyberShield - Backend Unavailable</title>
  <style>
    body {
      background: #050816; color: #F3F4F6;
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
    }
    .box {
      background: #0D1322; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 30px; max-width: 450px; text-align: center;
    }
    h2 { color: #9CA3AF; margin-top: 0; }
    p { font-size: 0.9rem; color: #6B7280; line-height: 1.5; }
    .btn {
      margin-top: 15px; padding: 10px 20px; border-radius: 8px;
      border: none; background: #00D9FF; color: #000; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>CyberShield Protection</h2>
    <p>Backend protection service is currently unavailable. CyberShield could not verify the target URL.</p>
    <button class="btn" onclick="window.history.back()">Go Back</button>
  </div>

</html>
