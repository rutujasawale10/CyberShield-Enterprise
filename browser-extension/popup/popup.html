<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield Extension</title>
  <style>
    :root {
      --bg-dark: #050816;
      --bg-card: #0D1322;
      --accent-cyan: #00D9FF;
      --status-safe: #00E676;
      --status-warning: #FFC107;
      --status-danger: #FF3D71;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --border-color: rgba(255, 255, 255, 0.08);
      --font-mono: 'JetBrains Mono', monospace, sans-serif;
    }
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }
    .logo-shield {
      color: var(--accent-cyan);
      font-size: 1.2rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status-protected { background: rgba(0, 230, 118, 0.15); color: var(--status-safe); border: 1px solid var(--status-safe); }
    .status-warning { background: rgba(255, 193, 7, 0.15); color: var(--status-warning); border: 1px solid var(--status-warning); }
    .status-blocked { background: rgba(255, 61, 113, 0.15); color: var(--status-danger); border: 1px solid var(--status-danger); }
    .status-offline { background: rgba(156, 163, 175, 0.15); color: var(--text-muted); border: 1px solid var(--text-muted); }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .url-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0 0 4px 0;
      text-transform: uppercase;
      font-weight: 600;
    }
    .url-text {
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      margin: 0 0 10px 0;
      word-break: break-all;
    }
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .metric-label { font-size: 0.8rem; color: var(--text-muted); }
    .metric-value { font-size: 0.85rem; font-weight: 700; }
    
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent-cyan); }
    input:checked + .slider:before { transform: translateX(20px); }

    .api-input-box {
      width: 100%;
      background: rgba(5, 8, 22, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 6px;
      box-sizing: border-box;
      margin-top: 6px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-cyber {
      background: linear-gradient(135deg, #00D9FF 0%, #0088FF 100%);
      color: #000;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .footer-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-shield">🛡️</span> CYBERSHIELD
    </div>
    <div id="statusBadge" class="status-badge status-offline">
      ● CHECKING
    </div>
  </div>

  <div class="card">
    <p class="url-title">Active Destination</p>
    <p id="currentUrl" class="url-text">Loading...</p>

    <div class="metric-row">
      <span class="metric-label">Risk Score</span>
      <span id="riskScore" class="metric-value" style="color: var(--text-muted);">N/A</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Classification</span>
      <span id="classification" class="metric-value">UNVERIFIED</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">Host Type</span>
      <span id="hostType" class="metric-value">UNKNOWN</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">IP / Country</span>
      <span id="geoInfo" class="metric-value">Unknown</span>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span style="font-weight: 600; font-size: 0.85rem;">Real-Time Protection</span>
      <label class="switch">
        <input type="checkbox" id="protectionToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;">
      <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Backend Protection API:</span>
      <input type="text" id="apiEndpointInput" class="api-input-box" value="http://localhost:8000/api" placeholder="https://cybershield.vercel.app/api">
    </div>
  </div>

  <button id="btnReport" class="btn btn-secondary">Report False Positive</button>
  <button id="btnDashboard" class="btn btn-cyber">Open SOC Console</button>

  <div class="footer-note">
    CyberShield Enterprise v4.0 • Zero-Trust Engine
  </div>

  <script src="popup.js"></script>
</body>
</html>
